{% extends "base.html" %}

{% block content %}
<div class="glass-form-container">
    <h2>🗓️ Agendar Atendimento</h2>
    <p class="form-subtext">Preencha seus dados para reservar. A administração será notificada automaticamente.</p>

    <form action="{{ url_for('booking') }}" method="POST">
        <div class="form-group">
            <label for="nome">Nome Completo:</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
        </div>

        <div class="form-group">
            <label for="telefone">WhatsApp / Telefone para Contato:</label>
            <input type="tel" id="telefone" name="telefone" placeholder="(11) 99999-9999" required>
        </div>

        <div class="form-group">
            <label for="servico_id">Procedimento Desejado:</label>
            <select id="servico_id" name="servico_id" required>
                <option value="" disabled selected>Selecione o serviço...</option>
                {% for s in servicos %}
                    <option value="{{ s['id'] }}">{{ s['nome'] }} — R$ {{ "%.2f"|format(s['preco']) }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="data">Data Desejada:</label>
                <input type="date" id="data" name="data" required>
            </div>
            <div class="form-group">
                <label for="hora">Horário Disponível:</label>
                <select id="hora" name="hora" required>
                    <option value="" disabled selected>Horários...</option>
                    {% for h in horarios %}
                        <option value="{{ h['hora'] }}">{{ h['hora'] }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <button type="submit" class="btn-gold-action full-width">Confirmar Reserva</button>
    </form>
</div>
{% endblock %}
