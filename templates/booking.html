{% extends "base.html" %}

{% block content %}
<div class="glass-form-container">
    <h2>🗓️ Agendar Atendimento com Cathelin Eloim</h2>
    <p class="form-subtext">Selecione uma data no calendário e escolha um horário disponível.</p>

    <form action="{{ url_for('booking') }}" method="POST" id="bookingForm">
        <div class="form-group">
            <label for="nome">Nome Completo:</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
        </div>

        <div class="form-group">
            <label for="telefone">WhatsApp / Telefone para Contato:</label>
            <input type="tel" id="telefone" name="telefone" placeholder="(11) 99999-9999" required>
        </div>

        <div class="form-group">
            <label for="servico_id">Procedimento Desejado:</label>
            <select id="servico_id" name="servico_id" required>
                <option value="" disabled selected>Selecione o procedimento...</option>
                {% for s in servicos %}
                    <option value="{{ s['id'] }}">{{ s['nome'] }} — R$ {{ "%.2f"|format(s['preco']) }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="data">📅 Data Desejada (Calendário):</label>
                <input type="date" id="data" name="data" required class="input-date-styled" onchange="carregarHorariosOcupados(this.value)">
            </div>
            
            <div class="form-group">
                <label for="hora">⏰ Horário Disponível:</label>
                <select id="hora" name="hora" required>
                    <option value="" disabled selected>Selecione a data primeiro...</option>
                    {% for h in horarios %}
                        <option value="{{ h['hora'] }}" data-hora="{{ h['hora'] }}">{{ h['hora'] }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <button type="submit" class="btn-pink-action full-width" id="btnSubmit">Confirmar Agendamento</button>
    </form>
</div>

<script>
function carregarHorariosOcupados(dataSelecionada) {
    const selectHora = document.getElementById('hora');
    const options = selectHora.querySelectorAll('option[data-hora]');
    
    options.forEach(opt => {
        opt.disabled = false;
        opt.textContent = opt.getAttribute('data-hora');
    });
    
    if (!dataSelecionada) return;

    fetch('/api/horarios-ocupados/' + dataSelecionada)
        .then(response => response.json())
        .then(ocupados => {
            options.forEach(opt => {
                const horaVal = opt.getAttribute('data-hora');
                if (ocupados.includes(horaVal)) {
                    opt.disabled = true;
                    opt.textContent = horaVal + ' ❌ (Ocupado)';
                }
            });
        });
}
</script>
{% endblock %}
